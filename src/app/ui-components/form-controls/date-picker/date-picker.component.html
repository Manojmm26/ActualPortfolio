<div class="ui-date-picker" [class.focused]="focused">
  <label *ngIf="label" class="ui-date-picker-label">
    {{ label }}
    <span *ngIf="required" class="required-indicator" aria-hidden="true">*</span>
  </label>

  <div class="date-picker-container" [class.inline]="inline">
    <!-- Input Field (not shown in inline mode) -->
    <button *ngIf="!inline"
            type="button"
            class="date-input"
            [class.disabled]="disabled"
            [attr.aria-label]="label || 'Date picker'"
            [attr.aria-expanded]="expanded"
            [attr.aria-disabled]="disabled"
            (click)="toggleDropdown()">
      <span class="input-value" [class.placeholder]="!value">
        {{ getDisplayValue() }}
      </span>
      <span class="calendar-icon">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M6 2a1 1 0 00-1 1v1H4a2 2 0 00-2 2v10a2 2 0 002 2h12a2 2 0 002-2V6a2 2 0 00-2-2h-1V3a1 1 0 10-2 0v1H7V3a1 1 0 00-1-1zm0 5a1 1 0 000 2h8a1 1 0 100-2H6z" clip-rule="evenodd" />
        </svg>
      </span>
    </button>

    <!-- Calendar Dropdown -->
    <div class="calendar-dropdown" *ngIf="expanded || inline"
         [class.expanded]="expanded"
         role="dialog"
         [attr.aria-label]="'Calendar'"
         (click)="$event.stopPropagation()">
      
      <!-- Navigation Header -->
      <div class="calendar-header">
        <button type="button"
                class="nav-button"
                (click)="navigateMonth(-1)"
                [attr.aria-label]="'Previous month'">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd" d="M12.707 5.293a1 1 0 010 1.414L9.414 10l3.293 3.293a1 1 0 01-1.414 1.414l-4-4a1 1 0 010-1.414l4-4a1 1 0 011.414 0z" clip-rule="evenodd" />
          </svg>
        </button>

        <div class="view-selectors">
          <button type="button"
                  class="month-selector"
                  (click)="changeView('months')"
                  [class.active]="currentView === 'months'">
            {{ monthNames[viewDate.getMonth()] }}
          </button>
          <button type="button"
                  class="year-selector"
                  (click)="changeView('years')"
                  [class.active]="currentView === 'years'">
            {{ viewDate.getFullYear() }}
          </button>
        </div>

        <button type="button"
                class="nav-button"
                (click)="navigateMonth(1)"
                [attr.aria-label]="'Next month'">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd" d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z" clip-rule="evenodd" />
          </svg>
        </button>
      </div>

      <!-- Days View -->
      <div class="calendar-view days-view" *ngIf="currentView === 'days'" role="grid">
        <!-- Weekday Headers -->
        <div class="weekday-header" role="row">
          <div *ngIf="showWeekNumbers" class="week-number-header" role="columnheader">#</div>
          <div *ngFor="let day of weekDays"
               class="weekday"
               role="columnheader"
               [attr.aria-label]="day">
            {{ day }}
          </div>
        </div>

        <!-- Calendar Grid -->
        <div class="calendar-grid">
          <div *ngFor="let week of getCalendarWeeks()"
               class="week"
               role="row">
            <div *ngIf="showWeekNumbers"
                 class="week-number"
                 role="gridcell">
              {{ getWeekNumber(week[0]) }}
            </div>
            <button *ngFor="let date of week"
                    type="button"
                    class="day"
                    [class.other-month]="isOtherMonth(date)"
                    [class.today]="isToday(date)"
                    [class.selected]="isSelected(date)"
                    [class.highlighted]="isHighlighted(date)"
                    [class.disabled]="isDisabled(date)"
                    [class.range-start]="isRangeStart(date)"
                    [class.range-end]="isRangeEnd(date)"
                    [class.in-range]="isInRange(date)"
                    [attr.aria-label]="formatDate(date)"
                    [attr.aria-selected]="isSelected(date)"
                    [attr.aria-disabled]="isDisabled(date)"
                    (click)="onDateClick(date)"
                    (mouseenter)="onDateHover(date)">
              {{ date.getDate() }}
            </button>
          </div>
        </div>
      </div>

      <!-- Months View -->
      <div class="calendar-view months-view" *ngIf="currentView === 'months'" role="grid">
        <div class="months-grid">
          <button *ngFor="let month of monthNames; let i = index"
                  type="button"
                  class="month"
                  [class.selected]="viewDate.getMonth() === i"
                  (click)="selectMonth(i)">
            {{ month }}
          </button>
        </div>
      </div>

      <!-- Years View -->
      <div class="calendar-view years-view" *ngIf="currentView === 'years'" role="grid">
        <div class="years-grid">
          <button *ngFor="let year of getYearRange()"
                  type="button"
                  class="year"
                  [class.selected]="viewDate.getFullYear() === year"
                  (click)="selectYear(year)">
            {{ year }}
          </button>
        </div>
      </div>

      <!-- Time Picker (if enabled) -->
      <div class="time-picker" *ngIf="showTime">
        <div class="time-inputs">
          <div class="time-input">
            <label>Hour</label>
            <input type="number"
                   [min]="0"
                   [max]="hourFormat === '12' ? 12 : 23"
                   [step]="stepHour"
                   [ngModel]="getHours()"
                   (ngModelChange)="updateHours($event)">
          </div>
          <div class="time-separator">:</div>
          <div class="time-input">
            <label>Minute</label>
            <input type="number"
                   [min]="0"
                   [max]="59"
                   [step]="stepMinute"
                   [ngModel]="getMinutes()"
                   (ngModelChange)="updateMinutes($event)">
          </div>
          <ng-container *ngIf="showSeconds">
            <div class="time-separator">:</div>
            <div class="time-input">
              <label>Second</label>
              <input type="number"
                     [min]="0"
                     [max]="59"
                     [step]="stepSecond"
                     [ngModel]="getSeconds()"
                     (ngModelChange)="updateSeconds($event)">
            </div>
          </ng-container>
          <div class="meridian-selector" *ngIf="hourFormat === '12'">
            <button type="button"
                    [class.active]="!isPM()"
                    (click)="toggleMeridian(false)">
              AM
            </button>
            <button type="button"
                    [class.active]="isPM()"
                    (click)="toggleMeridian(true)">
              PM
            </button>
          </div>
        </div>
      </div>

      <!-- Button Bar -->
      <div class="button-bar" *ngIf="showButtonBar">
        <button type="button"
                class="today-button"
                (click)="onTodayClick()">
          {{ todayButtonLabel }}
        </button>
        <button type="button"
                class="clear-button"
                (click)="onClearClick()">
          {{ clearButtonLabel }}
        </button>
      </div>
    </div>
  </div>
</div>
